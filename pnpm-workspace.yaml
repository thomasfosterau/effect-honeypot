packages:
  - packages/*
  - examples/*

catalogMode: prefer

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/platform-node": ^4.0.5
  "@effect/tsgo": 0.56.0 # Pinned: `effect-tsgo patch` supports only exact TypeScript / tsgolint versions
  "@effect/vitest": ^4.0.5
  "@mpsuesser/oxlint-plugin-effect": ^0.6.0
  "@types/node": ^24
  effect: ^4.0.5
  typescript: 7.0.2 # Pinned for @effect/tsgo
  vite-plus: 1.3.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  effect@*: "catalog:" # @mpsuesser/oxlint-plugin-effect pins effect 4.0.0; keep a single copy
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
