packages:
  - packages/*
  - examples/*

catalogMode: prefer

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/platform-node": ^4.0.5
  "@effect/vitest": ^4.0.5
  "@mpsuesser/oxlint-plugin-effect": ^0.6.0
  "@types/node": ^24
  effect: ^4.0.5
  typescript: ^7.0.2
  vite-plus: 1.3.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
