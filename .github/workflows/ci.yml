name: CI

# Every gate runs without a secret or a credential, so Dependabot PRs run it
# safely: read-only token, actions pinned to commit SHAs (setup-vp to an exact
# release tag), no persisted checkout credentials.

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs Vite+ at the catalog's `vite-plus` pin (auto-detected from
      # package.json / pnpm-workspace.yaml), Node.js, and the pnpm pinned by
      # package.json's `packageManager`, then runs `vp install`. The install
      # runs `prepare` (`vp config` + `effect-tsgo patch`), which `vp check`'s
      # `effecttsgo/*` rules and the `check` task's Effect diagnostics need.
      # Referenced by exact release tag, as its README asks (the moving `v1`
      # is frozen); .github/zizmor.yml allows a tag for this one action.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          # A pinned major, never `latest` or `lts`.
          node-version: "24"
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      # Format + lint, type-aware through oxlint-tsgolint (with `typeCheck`).
      - run: vp check
      - run: vp run check
      - run: vp test run
      - run: vp run -r build
      - run: pnpm audit --audit-level high
