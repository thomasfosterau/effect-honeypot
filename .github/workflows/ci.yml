name: CI

# Every gate runs without a secret or a credential, so Dependabot PRs run it
# safely: read-only token, actions locked by .github/workflows/actions.lock,
# no persisted checkout credentials.

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm pinned by package.json's `packageManager`.
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          # A pinned major, never `latest`: setup-node resolves `latest` to the
          # first nodejs.org index entry, pre-releases included.
          node-version: "24"
          cache: pnpm
      # Runs `prepare` (`vp config` + `effect-tsgo patch`), which `vp check`'s
      # `effecttsgo/*` rules and the `check` task's Effect diagnostics need.
      - run: pnpm install --frozen-lockfile
      # Format + lint, type-aware through oxlint-tsgolint (with `typeCheck`).
      - run: pnpm exec vp check
      - run: pnpm exec vp run check
      - run: pnpm exec vp test run
      - run: pnpm exec vp run -r build
      - run: pnpm audit --audit-level high
