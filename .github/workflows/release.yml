name: Release

# Changesets release flow: on every push to `main`, changesets/action either
# opens/updates the "Version packages" PR or, once that PR has merged and no
# changesets remain, publishes to npm (trusted publishing over OIDC).

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    # Never on forks, and never for a Dependabot-triggered run: this job holds
    # `id-token: write` and `contents: write`.
    if: github.repository == 'thomasfosterau/effect-honeypot' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the version branch and tags
      pull-requests: write # open/update the "Version packages" PR
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      # The Changesets action pushes the version branch, so it needs the
      # checkout's (job-scoped) git credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # A pinned major, never `latest` (which can resolve to a pre-release);
          # Node 24 bundles an npm new enough for trusted publishing.
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # v2 of the action renamed v1's `version` / `publish` / `title` /
      # `commit` inputs; the old names were silently ignored.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run changeset:version
          publish-script: pnpm run changeset:publish
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
