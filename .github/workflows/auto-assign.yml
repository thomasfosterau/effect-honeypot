name: Auto-assign

# Assigns each new pull request to the owner so it shows up in their queue.
# Dependabot's PRs are assigned by `assignees` in .github/dependabot.yml
# instead: a workflow Dependabot triggers gets a read-only token and could not
# assign anything.
#
# `pull_request` (never `pull_request_target`), no checkout and no action: the
# job only calls the GitHub API through the preinstalled `gh`, with the event's
# values passed through `env:` rather than interpolated into the script.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# No permissions by default; the job grants only what assigning needs.
permissions: {}

jobs:
  assign:
    name: assign the owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip Dependabot (see above) and pull requests that already have an assignee.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && join(github.event.pull_request.assignees.*.login) == ''
    permissions:
      pull-requests: write
    steps:
      - name: Assign
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
